name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

# Read by default; publishing jobs widen this themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      # Tag, pyproject.toml, and __init__.py must all agree before anything
      # is built or published — a mismatch burns the version number on PyPI.
      - name: Check tag matches pyproject.toml and __init__.py
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          INIT_VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/agentkv/__init__.py | head -1)

          echo "tag:            ${TAG_VERSION}"
          echo "pyproject.toml: ${PY_VERSION}"
          echo "__init__.py:    ${INIT_VERSION}"

          rc=0
          if [ "${TAG_VERSION}" != "${PY_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml ${PY_VERSION}"
            rc=1
          fi
          if [ "${TAG_VERSION}" != "${INIT_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match src/agentkv/__init__.py ${INIT_VERSION}"
            rc=1
          fi
          [ "${rc}" -eq 0 ] && echo "all versions agree on ${TAG_VERSION}"
          exit "${rc}"

  build:
    name: Build Dists
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: astral-sh/setup-uv@v4
      - run: uv build
      - run: uv tool run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: dist/
          if-no-files-found: error

  publish-github:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/
      - uses: softprops/action-gh-release@v2.3.2
        with:
          generate_release_notes: true
          files: dist/*

  publish-pypi:
    name: Publish PyPI
    # Gated on the GitHub release so a failed deb/wheel doesn't burn the
    # PyPI version number before everything is ready.
    needs: publish-github
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-kv
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
